<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>BallKnower</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="Live NBA score">
      <main class="score-stage" aria-live="polite">
        <div id="loading" class="loading-container hidden">
          <div class="loading-spinner"></div>
          <div class="loading-text">Updating scores</div>
        </div>

        <div id="error" class="error-container hidden">
          <div class="error-icon">!</div>
          <div class="error-message">Unable to load scores</div>
        </div>

        <div id="empty-state" class="empty-state hidden">
          <div class="empty-symbol">0</div>
          <h2>No NBA games</h2>
          <p>Check back when games are scheduled.</p>
        </div>

        <article id="game-card" class="game-card hidden">
          <div class="game-meta-row">
            <span id="game-status" class="game-status"></span>
            <span id="game-clock" class="game-clock"></span>
            <span id="game-count"></span>
          </div>

          <div class="matchup-row">
            <div class="team-row" id="away-row">
              <div class="team-label">
                <span id="away-code" class="team-code"></span>
                <span id="away-name" class="team-name"></span>
              </div>
              <div id="away-score" class="team-score"></div>
            </div>

            <div class="team-row" id="home-row">
              <div class="team-label">
                <span id="home-code" class="team-code"></span>
                <span id="home-name" class="team-name"></span>
              </div>
              <div id="home-score" class="team-score"></div>
            </div>
          </div>

          <div class="game-footer">
            <div id="play-by-play" class="play-by-play hidden" aria-live="polite"></div>
          </div>
        </article>
      </main>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
